<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Dias</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: #000000;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(255, 255, 255, 0.1);
      max-width: 500px;
      width: 100%;
      border: 2px solid #000000;
    }

    h1 {
      font-size: 2.5em;
      color: #000000;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .subtitle {
      color: #555555;
      font-size: 0.9em;
      margin-bottom: 30px;
      font-weight: 500;
    }

    #contador {
      font-size: 3em;
      font-weight: bold;
      margin: 30px 0;
      color: #000000;
      border: 3px solid #000000;
      padding: 20px;
      border-radius: 15px;
      background: #f0f0f0;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 30px 0;
    }

    button {
      padding: 12px 24px;
      font-size: 1em;
      cursor: pointer;
      border: 2px solid #000000;
      border-radius: 10px;
      background-color: #000000;
      color: white;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #333333;
      border-color: #333333;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-zerar {
      background-color: #ffffff;
      color: #000000;
      border: 2px solid #000000;
    }

    .btn-zerar:hover {
      background-color: #f0f0f0;
      border-color: #000000;
    }

    .btn-salvar {
      background-color: #000000;
      color: white;
      border: 2px solid #000000;
      flex: 1;
      min-width: 150px;
    }

    .btn-salvar:hover {
      background-color: #333333;
    }

    .btn-salvar.salvo {
      background-color: #000000;
    }

    .btn-salvar.salvo::after {
      content: " ✓";
    }

    #mensagem {
      margin-top: 30px;
      font-size: 1.1em;
      color: #000000;
      min-height: 60px;
      animation: slideIn 0.5s ease;
      font-weight: 500;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .info-box {
      background: #f0f0f0;
      border-left: 4px solid #000000;
      border: 2px solid #000000;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.9em;
      color: #000000;
    }

    .info-box strong {
      color: #000000;
    }

    .status-salvo {
      font-size: 0.8em;
      color: #666666;
      margin-top: 10px;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 2em;
      }

      #contador {
        font-size: 2.5em;
      }

      button {
        padding: 10px 20px;
        font-size: 0.9em;
      }

      .button-group {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⏰ Contador de Dias</h1>
    <p class="subtitle">Acompanhe seu progresso com motivação</p>
    
    <div id="contador">0 dias</div>

    <div class="button-group">
      <button onclick="alterarDias(1)">➕ +1 dia</button>
      <button onclick="alterarDias(-1)">➖ -1 dia</button>
      <button onclick="zerar()" class="btn-zerar">🔄 Zerar</button>
    </div>

    <div class="button-group">
      <button onclick="salvarManualmente()" class="btn-salvar">💾 Salvar Progresso</button>
    </div>

    <div id="mensagem"></div>

    <div class="status-salvo">
      <span id="status">Dados salvos automaticamente</span>
    </div>

    <div class="info-box">
      <strong>💡 Dica:</strong> Seus dados são salvos automaticamente a cada clique. Use o botão "Salvar Progresso" para garantir que tudo foi salvo!
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'contadorDias';
    let dias = 0;

    const versiculos = [
      "Filipenses 4:13 - Tudo posso naquele que me fortalece.",
      "Salmos 23:1 - O Senhor é o meu pastor, nada me faltará.",
      "Isaías 41:10 - Não temas, porque eu sou contigo.",
      "Romanos 8:28 - Todas as coisas cooperam para o bem.",
      "Josué 1:9 - Seja forte e corajoso."
    ];

    // Carregar dados do localStorage na inicialização
    function carregarDados() {
      const dadosSalvos = localStorage.getItem(STORAGE_KEY);
      if (dadosSalvos !== null) {
        dias = parseInt(dadosSalvos);
      }
    }

    // Salvar dados no localStorage
    function salvarDados() {
      localStorage.setItem(STORAGE_KEY, dias);
      mostrarStatusSalvo();
    }

    function mostrarStatusSalvo() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = '✓ Salvo com sucesso!';
      
      setTimeout(() => {
        statusEl.textContent = 'Dados salvos automaticamente';
      }, 2000);
    }

    function salvarManualmente() {
      salvarDados();
    }

    function atualizarTela() {
      let anos = Math.floor(dias / 365);
      let restoDias = dias % 365;

      let texto = "";

      if (anos > 0) {
        texto += anos + " ano" + (anos > 1 ? "s" : "");
        if (restoDias > 0) {
          texto += " e " + restoDias + " dia" + (restoDias > 1 ? "s" : "");
        }
      } else {
        texto = dias + " dia" + (dias !== 1 ? "s" : "");
      }

      document.getElementById("contador").innerText = texto;
    }

    function mostrarMensagem() {
      let mensagem = "";

      if (dias > 0 && dias % 365 === 0) {
        let versiculo = versiculos[Math.floor(Math.random() * versiculos.length)];
        mensagem = "🎉 Um ano completo! " + versiculo;
      } else if (dias > 0 && dias % 30 === 0) {
        mensagem = "👏 Parabéns, você está vencendo!";
      }

      document.getElementById("mensagem").innerText = mensagem;
    }

    function alterarDias(valor) {
      dias += valor;
      if (dias < 0) dias = 0;

      atualizarTela();
      mostrarMensagem();
      salvarDados();
    }

    function zerar() {
      dias = 0;
      atualizarTela();
      document.getElementById("mensagem").innerText = "";
      salvarDados();
    }

    // Inicializar
    carregarDados();
    atualizarTela();
  </script>

</body>
</html>
